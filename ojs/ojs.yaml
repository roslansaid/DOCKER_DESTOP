apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ojs-db-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ojs-files
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ojs-public
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ojs-db
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ojs-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ojs-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ojs-db
  template:
    metadata:
      labels:
        app: ojs-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: ojs
            - name: MARIADB_USER
              value: ojs
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ojs-db-credentials
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ojs-db-credentials
                  key: root-password
          volumeMounts:
            - name: database
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mariadb-admin
                - ping
                - --silent
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - mariadb-admin
                - ping
                - --silent
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: ojs-db-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ojs
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ojs
  template:
    metadata:
      labels:
        app: ojs
    spec:
      containers:
        - name: ojs
          image: pkpofficial/ojs@sha256:202b82352f16485de0d33860ab392ee32835aab6bef5e9e18f41e6ed3f2d66ea
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SERVERNAME
              value: ojs.localhost
            - name: HTTPS
              value: "on"
            - name: PKP_CLI_INSTALL
              value: "0"
            - name: PKP_DB_HOST
              value: ojs-db:3306
            - name: PKP_DB_NAME
              value: ojs
            - name: PKP_DB_USER
              value: ojs
            - name: PKP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ojs-db-credentials
                  key: password
          volumeMounts:
            - name: files
              mountPath: /var/www/files
            - name: public
              mountPath: /var/www/public
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: ojs-files
        - name: public
          persistentVolumeClaim:
            claimName: ojs-public
---
apiVersion: v1
kind: Service
metadata:
  name: ojs
  namespace: default
spec:
  type: NodePort
  selector:
    app: ojs
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30084
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ojs
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: ojs.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ojs
                port:
                  number: 80
