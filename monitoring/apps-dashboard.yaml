apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-apps-dashboard
  namespace: default
data:
  wordpress-ojs.json: |
    {
      "id": null,
      "uid": "wordpress-ojs-monitoring",
      "title": "WordPress and OJS Availability",
      "tags": ["wordpress", "ojs", "availability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "WordPress Availability", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_success{app=\"wordpress\"}", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "none", "justifyMode": "auto"}},
        {"id": 2, "type": "stat", "title": "OJS Availability", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_success{app=\"ojs\"}", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "none", "justifyMode": "auto"}},
        {"id": 3, "type": "timeseries", "title": "App Response Time", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_duration_seconds{app=~\"wordpress|ojs\"}", "legendFormat": "{{app}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}},
        {"id": 4, "type": "timeseries", "title": "HTTP Status Code", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_http_status_code{app=~\"wordpress|ojs\"}", "legendFormat": "{{app}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}},
        {"id": 5, "type": "timeseries", "title": "App Availability", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_success{app=~\"wordpress|ojs\"}", "legendFormat": "{{app}}", "refId": "A"}], "fieldConfig": {"defaults": {"min": 0, "max": 1, "unit": "percentunit"}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}}
      ]
    }
