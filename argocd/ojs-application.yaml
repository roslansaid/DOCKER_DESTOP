apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ojs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/roslansaid/DOCKER_DESTOP.git
    targetRevision: main
    path: ojs
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}
